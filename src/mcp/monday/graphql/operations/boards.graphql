query GetBoard($boardId: ID!) {
  boards(ids: [$boardId]) {
    id
    name
    description
    columns {
      id
      title
      type
    }
    items_count
    groups {
      id
      title
    }
    items_page(limit: 100) {
      items {
        id
        name
        column_values {
          id
          text
          value
          type
        }
      }
    }
  }
} 