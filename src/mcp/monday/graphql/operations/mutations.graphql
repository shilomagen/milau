mutation ChangeColumnValue($itemId: ID!, $boardId: ID!, $columnId: String!, $value: JSON!) {
  change_column_value(item_id: $itemId, board_id: $boardId, column_id: $columnId, value: $value) {
    id
    name
    column_values {
      id
      text
      value
      type
    }
  }
}

mutation CreateUpdate($itemId: ID!, $updateText: String!) {
  create_update(item_id: $itemId, body: $updateText) {
    id
    body
    created_at
    creator {
      id
      name
    }
  }
}

mutation CreateItem($boardId: ID!, $itemName: String!, $columnValues: JSON) {
  create_item(board_id: $boardId, item_name: $itemName, column_values: $columnValues) {
    id
    name
    board {
      id
    }
    column_values {
      id
      text
      value
    }
  }
} 